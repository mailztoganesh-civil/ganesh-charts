name: Update fundamentals (CAN SLIM)

# Fully automatic:
#  - runs by itself the first time these files are uploaded (push)
#  - every weekday 19:30 IST: only companies that just filed results (fast)
#  - every Saturday 07:00 IST: all stocks (full refresh)
on:
  push:
    paths:
      - ".github/workflows/fundamentals.yml"
      - "scripts/fetch_fundamentals.py"
  schedule:
    - cron: "0 14 * * 1-5"      # daily, 19:30 IST
    - cron: "30 1 * * 6"        # weekly full, Saturday 07:00 IST
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fundamentals
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas requests
      - name: Fetch fundamentals
        run: |
          if [ "${{ github.event.schedule }}" = "0 14 * * 1-5" ] && [ -f data/fundamentals.json ]; then
            export MODE=daily
          else
            export MODE=full
          fi
          echo "Mode: $MODE"
          python scripts/fetch_fundamentals.py
        env:
          WORKERS: "3"
          MAX_MINUTES: "310"
      - name: Commit data/fundamentals.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fundamentals.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update fundamentals $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 10; done
