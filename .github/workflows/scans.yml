name: Evening scans

# Fully automatic:
#  - runs by itself when these files are uploaded (push)
#  - every weekday 17:37 IST, with a backup run at 19:07 IST (GitHub often starts scheduled jobs
#    late; a run skips itself if tonight's scan is already done)
# Runs every scanner of the app on all NSE stocks and writes data/scans.json, which the app shows
# as "Tonight's results".
on:
  push:
    paths:
      - ".github/workflows/scans.yml"
      - "**/*run*scans*"
  schedule:
    - cron: "7 12 * * 1-5"      # 17:37 IST
    - cron: "37 13 * * 1-5"     # 19:07 IST backup
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scans
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Skip if tonight's scan is already done
        id: fresh
        run: |
          # results written after today's NSE close (10:00 UTC) = already done
          if [ -f data/scans.json ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            UPD=$(node -e "try{console.log(JSON.parse(require('fs').readFileSync('data/scans.json','utf8')).updated||'')}catch{console.log('')}")
            TODAY=$(date -u +%Y-%m-%d)
            if [ "${UPD:0:10}" = "$TODAY" ] && [ "${UPD:11:2}" -ge 10 ]; then echo "Already scanned at $UPD"; echo "skip=1" >> $GITHUB_OUTPUT; fi
          fi
      - name: Run all scanners
        if: steps.fresh.outputs.skip != '1'
        run: |
          # find the script wherever it was uploaded (any folder, .mjs / .js / .txt)
          SCRIPT=$(git ls-files | grep -iE 'run[ _-]?scans\.(mjs|js|txt)$' | head -1)
          if [ -z "$SCRIPT" ]; then echo "run_scans.mjs not found in the repo"; exit 1; fi
          echo "Using $SCRIPT"
          mkdir -p scripts
          cp "$SCRIPT" scripts/run_scans_job.mjs
          node scripts/run_scans_job.mjs
        env:
          CONCURRENCY: "6"
      - name: Commit data/scans.json
        if: steps.fresh.outputs.skip != '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/scans.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update evening scans $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 10; done
