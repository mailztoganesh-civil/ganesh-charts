name: Update momentum portfolio

# Fully automatic:
#  - runs by itself when these files are uploaded (push)
#  - every weekday 16:45 IST, after the NSE close (the list itself only changes at month end;
#    daily runs keep the "live ranking" preview and this month's return up to date)
on:
  push:
    paths:
      - ".github/workflows/momentum.yml"
      - "**/*momentum*.py"
  schedule:
    - cron: "15 11 * * 1-5"     # 16:45 IST
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: momentum
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas numpy
      - name: Rank momentum
        run: |
          # find the script wherever it was uploaded (any folder, any spacing of the name)
          SCRIPT=$(git ls-files | grep -iE 'fetch[ _-]?momentum\.py$' | head -1)
          if [ -z "$SCRIPT" ]; then echo "fetch_momentum.py not found in the repo"; exit 1; fi
          echo "Using $SCRIPT"
          mkdir -p scripts
          if [ "$SCRIPT" != "scripts/fetch_momentum.py" ]; then cp "$SCRIPT" scripts/fetch_momentum.py; fi
          python scripts/fetch_momentum.py
        env:
          TOP_N: "20"
          MIN_CR: "10"
      - name: Commit data/momentum.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/momentum.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update momentum $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 10; done
