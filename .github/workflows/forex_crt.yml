name: Forex CRT scan

# Runs the CRT screener for the Forex CRT app (forex/) every 30 minutes while the
# forex market is open (Sunday 17:00 NY to Friday 17:00 NY) and writes forex/data/crt.json.
on:
  push:
    paths:
      - ".github/workflows/forex_crt.yml"
      - "scripts/forex_crt.py"
      - "scripts/test_forex_crt.py"
      - "forex/live.js"
      - "forex/tests/**"
  schedule:
    - cron: "4,34 * * * 1-5"
    - cron: "4,34 21-23 * * 0"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: forex-crt
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --upgrade yfinance pandas
      - name: C1/C2 identification tests (Python scanner and phone engine)
        run: |
          python -m unittest scripts/test_forex_crt.py
          node forex/tests/run_tests.js
      - name: Scan
        run: python -u scripts/forex_crt.py
      - name: Commit forex/data/crt.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forex/data/crt.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Forex CRT scan $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 10; done
